server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Scanners probe for .env/.git/*.php etc.; 404 instead of serving index.html as a soft 200.
    location ~ /\. {
        return 404;
    }

    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
