services:
  gateway:
    image: ghcr.io/${GHCR_NAMESPACE}/gateway:${IMAGE_TAG:-latest}
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env, e.g. https://anujb.dev}
      Tools__BaseUrl: ${TOOLS_BASE_URL:-http://tools:8000}
      WebPush__VapidSubject: ${VAPID_SUBJECT:-mailto:bhardwaj.anuj64@gmail.com}
      WebPush__VapidPublicKey: ${VAPID_PUBLIC_KEY:-}
      WebPush__VapidPrivateKey: ${VAPID_PRIVATE_KEY:-}
      Smtp__User: ${SMTP_USER:-}
      Smtp__AppPassword: ${SMTP_APP_PASSWORD:-}
    volumes:
      # Persists push subscriptions across redeploys — everything else in the gateway is
      # deliberately in-memory (OTP challenges are 60s-lived, job results are transient).
      - gateway-data:/app/data
      # Read-only: lets the Gateway list sibling containers (Systems Lab / admin dashboard
      # telemetry) via the Docker Engine API without giving it control over the daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - tools
    networks:
      - portfolio-network
    restart: unless-stopped

  # Segmentation, tonal-banding, and mesh-generation, consolidated into one
  # container (see github.com/bhardwaj-anuj64/portfolio-microservices/knowledge/) —
  # internal only, the Gateway is the only thing that talks to it. Built and published
  # by that repo's own CI, not this one — versioned independently, so it isn't pinned
  # to this deploy's sha_tag the way gateway/frontend are.
  tools:
    image: ghcr.io/bhardwaj-anuj64/portfolio-microservices/tools:${TOOLS_IMAGE_TAG:-latest}
    networks:
      - portfolio-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_NAMESPACE}/frontend:${IMAGE_TAG:-latest}
    ports:
      - "8080:80"
    depends_on:
      - gateway
    networks:
      - portfolio-network
    restart: unless-stopped

  # Public hostnames -> http://frontend:80 / http://gateway:5000 are configured in the Cloudflare
  # Zero Trust dashboard for this tunnel token, not here.
  cloudflared:
    image: cloudflare/cloudflared:latest
    # protocol pinned to http2 (TCP) — quic (UDP) had one of its 4 connections
    # flapping repeatedly against the same edge IP, likely a NAT/UDP path issue.
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - frontend
      - gateway
    networks:
      - portfolio-network
    restart: unless-stopped

networks:
  portfolio-network:
    driver: bridge

volumes:
  gateway-data:
