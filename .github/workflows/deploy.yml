name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc -b

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore Gateway
        working-directory: backend/Gateway
        run: dotnet restore

      - name: Build Gateway
        working-directory: backend/Gateway
        run: dotnet build --no-restore --configuration Release

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v7

      # ghcr.io rejects uppercase image paths; github.repository can contain uppercase.
      # sha_tag is computed here (not left to metadata-action's type=sha) so the deploy job
      # can pull this exact, immutable tag instead of racing the mutable :latest tag.
      - name: Compute image namespace and tag
        id: vars
        run: |
          echo "namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.vars.outputs.namespace }}/frontend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.sha_tag }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Gateway image metadata
        id: meta-gateway
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.vars.outputs.namespace }}/gateway
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.sha_tag }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/Gateway
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs on a self-hosted runner living on the home server itself (registered there, not
  # reachable from GitHub's cloud runners — the server sits behind NAT with no port forward).
  # The runner polls GitHub outbound, so no inbound access or SSH secrets are needed.
  # Requires GHCR_PAT (a PAT with read:packages) as a repo secret, and .env already present on
  # the runner host (secrets aren't in git, so that file is still managed by hand). The compose
  # file itself is NOT hand-maintained on the host — every run checks out the repo fresh and
  # deploys straight from that copy of docker-compose.prod.yml, so a compose change merged to
  # main takes effect on the very next deploy instead of needing a manual scp to the server.
  # --env-file .env is required because the compose file now lives in the checkout dir, not
  # /home/deploy/app — Compose resolves .env relative to the compose file's location by
  # default, not the shell's working directory, so without this flag GHCR_NAMESPACE silently
  # resolves empty and image refs become ghcr.io//frontend.
  deploy:
    needs: publish
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      # Read before this run touches anything, so it still reflects the tag that was actually
      # healthy last time — not this run's (possibly broken) tag. Lives outside the checkout dir
      # (which is replaced every run) so it survives between deploys. Absent on the very first
      # run after this step was added, or the very first deploy ever — rollback is a no-op then.
      - name: Read last-known-good image tag
        id: prev
        working-directory: /home/deploy/app
        run: echo "tag=$(cat .last-good-tag 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      # -p pins the Compose project name. Without it, Compose derives the name from the
      # compose file's directory — so a future change to where that file is checked out
      # (like this one) silently renames the project, "up -d" can't recognize the
      # previous containers as the same app, and the old ones keep squatting the ports
      # forever instead of being replaced. Never remove this flag.
      - name: Pull and restart via Docker Compose
        working-directory: /home/deploy/app
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.sha_tag }}
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose -p new-portfolio --env-file .env -f "$GITHUB_WORKSPACE/docker-compose.prod.yml" pull
          docker compose -p new-portfolio --env-file .env -f "$GITHUB_WORKSPACE/docker-compose.prod.yml" up -d --remove-orphans

      # Containers restarting isn't the same as containers working — confirm both host-mapped
      # ports actually answer before calling the deploy done, so a broken image fails the run
      # instead of silently going live.
      - name: Health check
        working-directory: /home/deploy/app
        run: |
          set -e
          check() {
            for i in $(seq 1 15); do
              if curl -sf "$1" > /dev/null; then
                echo "$1 is healthy"
                return 0
              fi
              sleep 2
            done
            echo "$1 failed to become healthy after 30s" >&2
            return 1
          }
          check http://localhost:5000/api/system/health
          check http://localhost:8080/

      - name: Record this tag as last-known-good
        if: success()
        working-directory: /home/deploy/app
        run: echo "${{ needs.publish.outputs.sha_tag }}" > .last-good-tag

      # Only reachable if the health check (or an earlier step) failed. Re-deploys the previous
      # working tag so the site self-heals instead of staying on a broken version until someone
      # notices. No-op (skipped) if there's no prior good tag to roll back to.
      - name: Roll back to last-known-good tag
        id: rollback
        if: failure() && steps.prev.outputs.tag != ''
        working-directory: /home/deploy/app
        env:
          IMAGE_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          echo "Deploy of ${{ needs.publish.outputs.sha_tag }} failed health check — rolling back to ${{ steps.prev.outputs.tag }}"
          docker compose -p new-portfolio --env-file .env -f "$GITHUB_WORKSPACE/docker-compose.prod.yml" pull
          docker compose -p new-portfolio --env-file .env -f "$GITHUB_WORKSPACE/docker-compose.prod.yml" up -d --remove-orphans

      # Runs after the rollback attempt above (if any), so the gateway is (hopefully) back on a
      # known-working version by the time this fires — the notify call itself depends on the
      # gateway being up. Pushes through the same admin-OTP ntfy channel rather than a third-party
      # service; silently does nothing if no device is subscribed or the secret isn't set yet.
      # Message branches on steps.rollback.outcome, not just whether a previous tag existed —
      # otherwise a rollback that itself failed (e.g. GHCR evicted the old tag) would still claim
      # "Rolled back to X" even though the site may still be down.
      - name: Notify on deploy failure
        if: failure()
        working-directory: /home/deploy/app
        run: |
          if [ -z "${{ steps.prev.outputs.tag }}" ]; then
            msg="Deploy of ${{ needs.publish.outputs.sha_tag }} failed health check. No previous tag to roll back to — site may be down."
          elif [ "${{ steps.rollback.outcome }}" = "success" ]; then
            msg="Deploy of ${{ needs.publish.outputs.sha_tag }} failed health check. Rolled back to ${{ steps.prev.outputs.tag }}."
          else
            msg="Deploy of ${{ needs.publish.outputs.sha_tag }} failed health check. Rollback to ${{ steps.prev.outputs.tag }} also failed — site may still be down."
          fi
          curl -sf -X POST http://localhost:5000/api/notify/deploy-failure \
            -H "Content-Type: application/json" \
            -d "$(printf '{"secret":"%s","message":"%s"}' "${{ secrets.DEPLOY_NOTIFY_SECRET }}" "$msg")" \
            || echo "::warning::Deploy-failure push notification could not be delivered"
