name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc -b

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore Gateway
        working-directory: backend/Gateway
        run: dotnet restore

      - name: Build Gateway
        working-directory: backend/Gateway
        run: dotnet build --no-restore --configuration Release

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v7

      # ghcr.io rejects uppercase image paths; github.repository can contain uppercase.
      # sha_tag is computed here (not left to metadata-action's type=sha) so the deploy job
      # can pull this exact, immutable tag instead of racing the mutable :latest tag.
      - name: Compute image namespace and tag
        id: vars
        run: |
          echo "namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.vars.outputs.namespace }}/frontend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.sha_tag }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Gateway image metadata
        id: meta-gateway
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.vars.outputs.namespace }}/gateway
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.sha_tag }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/Gateway
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tools image metadata
        id: meta-tools
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.vars.outputs.namespace }}/tools
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.sha_tag }}

      - name: Build and push tools image
        uses: docker/build-push-action@v7
        with:
          context: ./portfolio-microservices/tools-service
          push: true
          tags: ${{ steps.meta-tools.outputs.tags }}
          labels: ${{ steps.meta-tools.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs on a self-hosted runner living on the home server itself (registered there, not
  # reachable from GitHub's cloud runners — the server sits behind NAT with no port forward).
  # The runner polls GitHub outbound, so no inbound access or SSH secrets are needed.
  # Requires GHCR_PAT (a PAT with read:packages) as a repo secret, and
  # ~/app/docker-compose.prod.yml + .env already present on the runner host.
  deploy:
    needs: publish
    runs-on: self-hosted
    steps:
      - name: Pull and restart via Docker Compose
        working-directory: /home/deploy/app
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.sha_tag }}
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
